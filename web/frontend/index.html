<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球市场日报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        header {
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 10px;
        }
        
        .nav-tab {
            padding: 8px 16px;
            border: none;
            background: #f0f0f0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .nav-tab:hover {
            background: #e0e0e0;
        }
        
        .nav-tab.active {
            background: #1890ff;
            color: white;
        }
        
        .report-content {
            background: #fafafa;
            padding: 30px;
            border-radius: 4px;
            border: 1px solid #eaeaea;
        }
        
        .report-content pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .error {
            background: #fff1f0;
            border: 1px solid #ffa39e;
            padding: 15px;
            border-radius: 4px;
            color: #f5222d;
            margin-bottom: 20px;
        }
        
        .meta-info {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eaeaea;
            font-size: 12px;
            color: #999;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #1890ff;
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(24,144,255,0.4);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .refresh-btn:hover {
            transform: rotate(180deg);
            box-shadow: 0 4px 12px rgba(24,144,255,0.6);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .report-content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📈 全球市场日报</h1>
            <div class="subtitle" id="currentDate"></div>
        </header>
        
        <div class="nav-tabs">
            <button class="nav-tab active" data-type="daily">全天复盘</button>
            <button class="nav-tab" data-type="noon">午间速览</button>
        </div>
        
        <div id="errorBox" class="error" style="display: none;"></div>
        
        <div id="reportContent" class="report-content">
            <div class="loading">加载中...</div>
        </div>
        
        <div class="meta-info">
            <span>最后更新：<span id="lastUpdate">-</span></span>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="loadReport()" title="刷新">↻</button>
    
    <script>
        // API 地址配置
        // 优先从环境变量读取（Cloudflare Pages 部署时通过 _worker.js 注入）
        // 本地开发时使用默认值
        const API_BASE = window.ENV_API_BASE || 'https://finance-dash-api.your-account.workers.dev';
        let currentType = 'daily';
        
        // 设置当前日期
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('zh-CN', {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            weekday: 'long'
        });
        
        // Tab 切换
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentType = tab.dataset.type;
                loadReport();
            });
        });
        
        // 加载报告
        async function loadReport() {
            const contentDiv = document.getElementById('reportContent');
            const errorBox = document.getElementById('errorBox');
            const lastUpdate = document.getElementById('lastUpdate');
            
            contentDiv.innerHTML = '<div class="loading">加载中...</div>';
            errorBox.style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE}/api/reports/latest?report_type=${currentType}`);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        contentDiv.innerHTML = '<div class="loading">暂无报告，等待首次生成...</div>';
                        return;
                    }
                    throw new Error('加载失败');
                }
                
                const data = await response.json();
                
                contentDiv.innerHTML = `<pre>${escapeHtml(data.content)}</pre>`;
                lastUpdate.textContent = new Date(data.created_at).toLocaleString('zh-CN');
                
            } catch (err) {
                errorBox.textContent = `加载失败：${err.message}`;
                errorBox.style.display = 'block';
                contentDiv.innerHTML = '<div class="loading">加载失败，请刷新重试</div>';
            }
        }
        
        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 页面加载时获取报告
        loadReport();
        
        // 每 5 分钟自动刷新
        setInterval(loadReport, 5 * 60 * 1000);
    </script>
</body>
</html>
