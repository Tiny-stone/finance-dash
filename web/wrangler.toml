# Cloudflare Workers 部署配置
name = "finance-dash"
compatibility_date = "2024-01-01"
main = "worker/index.js"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "finance-dash-db"
database_id = "cf61d0a1-5ff6-4562-a6ad-0c84dacab9bb"

# 环境变量
[vars]
TZ = "Asia/Shanghai"

# 定时任务触发
[triggers]
crons = ["30 11 * * 1-5", "30 15 * * 1-5", "0 10 * * 2-6"]

# 开发环境配置
[dev]
port = 8787
local_protocol = "http"
