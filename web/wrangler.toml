# Cloudflare Workers 部署配置
name = "finance-dash"
compatibility_date = "2024-01-01"
main = "worker/index.js"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "finance-dash-db"
database_id = ""  # 创建后填入: wrangler d1 create finance-dash-db

# 前端静态资源托管
[[assets]]
directory = "./frontend"
binding = "ASSETS"

# 环境变量
[vars]
TZ = "Asia/Shanghai"

# 密钥（生产环境建议用 wrangler secret put FETCHER_SECRET）
# FETCHER_SECRET = "your-secret-key-here"

# 可选：外部抓取服务地址（如果 Workers 要触发它）
# FETCHER_URL = "https://your-fetcher-server.com"

# 定时任务触发
[triggers]
crons = ["30 11 * * 1-5", "30 15 * * 1-5", "0 10 * * 2-6"]
# 11:30 午间速览 (周一到周五)
# 15:30 全天复盘 (周一到周五)
# 10:00 美股复盘 (周二到周六，对应周一到周五美股收盘后)

# 开发环境配置
[dev]
port = 8787
local_protocol = "http"
