# Cloudflare 全栈部署配置
name = "finance-dash"
compatibility_date = "2024-01-01"
main = "worker/index.js"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "finance-dash-db"
database_id = ""  # 创建后填入

# 前端静态资源（Pages）
[site]
bucket = "./frontend"

# 环境变量
[vars]
TZ = "Asia/Shanghai"

# 开发环境配置
[dev]
port = 8787
local_protocol = "http"
